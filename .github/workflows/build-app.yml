name: Build AppDemo (Android, Desktop, iOS)

on:
  push:
    branches: [ trilivechat ]
  pull_request:
    branches: [ trilivechat ]

jobs:
  build-android-desktop:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: true

      - name: Build Android Debug APK
        run: ./gradlew :androidApp:assembleDebug

      - name: Build Desktop Distribution
        run: ./gradlew :desktopApp:packageDistributionForCurrentOs

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk

      - name: Upload Desktop Distribution
        uses: actions/upload-artifact@v4
        with:
          name: desktop-distribution
          path: desktopApp/build/compose/binaries/main/

  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: true

      - name: Build iOS Simulator App
        run: |
          cd iosApp
          xcodebuild -project iosApp.xcodeproj -scheme iosApp -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

      - name: Upload iOS App Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: ~/Library/Developer/Xcode/DerivedData/*/Build/Products/Debug-iphonesimulator/*.app
