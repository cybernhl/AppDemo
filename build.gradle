tasks.register("prepareRemoteSharedFramework") {
    group = "build"
    description = "Compile Shared.framework from remote Jitpack klib dependencies for iOS"

    def target = project.hasProperty("iosTarget") ? project.property("iosTarget") : "iosSimulatorArm64"
    def buildType = project.hasProperty("buildType") ? project.property("buildType") : "debug"

    def capitalizedTarget = target.toString().capitalize()
    def capitalizedBuildType = buildType.toString().capitalize()
    def linkTaskName = "link${capitalizedBuildType}Framework$capitalizedTarget"

    dependsOn(linkTaskName)

    def layoutBuildDir = layout.buildDirectory
    def rootProjectDir = rootDir
    def outputDirProp = project.findProperty("outputPath")

    doLast {
        def buildDirFile = layoutBuildDir.get().asFile
        def sourceFramework = new File(buildDirFile, "bin/$target/${buildType}Framework/Shared.framework")
        def destFramework = new File(rootProjectDir, "shared/build/xcode-frameworks/${capitalizedBuildType}/Shared.framework")

        if (sourceFramework.exists()) {
            destFramework.parentFile.mkdirs()
            ant.copy(todir: destFramework) {
                fileset(dir: sourceFramework)
            }
            println(">>> [prepareRemoteSharedFramework] Successfully compiled and copied Shared.framework to ${destFramework.absolutePath}")

            if (outputDirProp) {
                def outputDir = new File(outputDirProp.toString(), "Shared.framework")
                outputDir.parentFile.mkdirs()
                ant.copy(todir: outputDir) {
                    fileset(dir: sourceFramework)
                }
                println(">>> [prepareRemoteSharedFramework] Successfully copied Shared.framework to Xcode output: ${outputDir.absolutePath}")
            }
        } else {
            throw new GradleException("Failed to find compiled Shared.framework at ${sourceFramework.absolutePath}")
        }
    }
}