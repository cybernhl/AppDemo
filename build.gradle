buildscript {
    ext {
        //Ref : https://developer.android.com/build/releases/past-releases
        agp_gradle = libs.versions.agp.get()
        println "Type of libs.versions.agp: " + libs.versions.agp.class
        println ">>> TYPE TEST >>> libs.versions.agp class: " + libs.versions.agp.class.name
        kotlin_version = "1.9.25"
        println "Show  kotlin_version  : ${kotlin_version}"
        kotlin_version = libs.versions.kotlin.asProvider().get()
        println "Type of libs.versions.kotlin: " + libs.versions.kotlin.class
        println ">>> TYPE TEST >>> libs.versions.kotlin class: " + libs.versions.kotlin.class.name
        println "Show  kotlin_version  : ${kotlin_version}"

        navigation_version = libs.versions.androidx.navigation.get()

        coroutine_version = "1.6.4"
        jb_compose_version = libs.versions.jetbrains.compose.multiplatform.get()
        println "Type of libs.versions.jetbrains.compose.multiplatform: " + libs.versions.jetbrains.compose.multiplatform.class
        println ">>> TYPE TEST >>> libs.versions.jetbrains.compose.multiplatform class: " + libs.versions.jetbrains.compose.multiplatform.class.name

        navigation_version = libs.versions.androidx.navigation.get()
    }

    println "Show  fianl kotlin_version  : ${kotlin_version}"

    repositories {
        gradlePluginPortal()
        mavenCentral()
        google()
        maven {
            url "https://plugins.gradle.org/m2/"
        }
        maven {
            url = uri('https://maven.pkg.jetbrains.space/public/p/compose/dev')
        }
    }
    dependencies {
//        classpath "com.android.tools.build:gradle:$agp_gradle"
//        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
//        classpath "org.jetbrains.kotlin:kotlin-serialization:$kotlin_version"
    }
}

plugins {
    alias(libs.plugins.android.application) apply false
    alias(libs.plugins.android.library) apply false
    alias(libs.plugins.android.kotlin.multiplatform.library) apply false

    alias(libs.plugins.kotlin.jvm) apply false
    alias(libs.plugins.kotlin.android) apply false
    alias(libs.plugins.kotlin.multiplatform) apply false

    alias(libs.plugins.jetbrains.compose) apply false
    alias(libs.plugins.compose.compiler) apply false

    alias(libs.plugins.kotlin.serialization) apply false

    alias(libs.plugins.ksp) apply false
    alias(libs.plugins.google.services) apply false
    alias(libs.plugins.svgToCompose) apply false
}

allprojects {
    project.tasks.findByName("run")?.let { task ->
        if (task is JavaExec) {
            println(">>> [afterEvaluate] 'run' task workingDir is: ${task.workingDir}")
            println(">>> [afterEvaluate] 'run' task commandLine is: ${task.commandLine.joinToString(" ")}")
        } else {
            println(">>> [afterEvaluate] 'run' task found, but it's not a JavaExec task. Type: ${task::class.java.name}")
        }
    } ?: println(">>> [afterEvaluate] 'run' task NOT found.")
    afterEvaluate {
    }
}

subprojects {
    afterEvaluate {
    }
}
